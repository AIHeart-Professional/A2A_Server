intents:
  view_my_stats:
    tool: [get_my_character]
    agent: [character]
  view_other_player_stats:
    tool: [get_another_players_character]
    agent: [character]
  create_character:
    tool: [check_character_limit, check_for_active_character, create_character]
    agent: [character, database]
    prerequisite: [check_character_limit, check_for_active_character]
  check_character_limit:
    tool: [check_character_limit]
    agent: [character]
  check_for_active_character:
    tool: [check_for_active_character]
    agent: [character]
  missing_fields:
    tool: [missing_fields]
    agent: [character]
